# =============================================================================
# Docker Compose — 9 Ubuntu CIS Assessment Targets
# =============================================================================
# Folder Convention:
#   ubuntu20/        ubuntu20_base/
#   ubuntu_20_optim/  ubuntu_20_optimized/
#   ubuntu_20_mix/    ubuntu_20_mixed/
#   ubuntu22/        ubuntu22_base/
#   ubuntu_22_optim/  ubuntu_22_optimized/
#   ubuntu_22_mix/    ubuntu_22_mixed/
#   ubuntu24/        ubuntu24_base/
#   ubuntu_24_optim/  ubuntu_24_optimized/
#   ubuntu_24_mix/    ubuntu_24_mixed/
#
# Start:
#   docker compose up -d --build
#
# Stop:
#   docker compose down
#
# SSH:
#   Ubuntu 20 Base:       ssh dev@localhost -p 2226
#   Ubuntu 20 Optimized:  ssh dev@localhost -p 2220
#   Ubuntu 20 Mixed:      ssh dev@localhost -p 2221
#   Ubuntu 22 Base:       ssh dev@localhost -p 2227
#   Ubuntu 22 Optimized:  ssh dev@localhost -p 2222
#   Ubuntu 22 Mixed:      ssh dev@localhost -p 2223
#   Ubuntu 24 Base:       ssh dev@localhost -p 2228
#   Ubuntu 24 Optimized:  ssh dev@localhost -p 2224
#   Ubuntu 24 Mixed:      ssh dev@localhost -p 2225
#
# Credentials:
#   User: dev
#   Password: dev
#
#   Root:
#   User: root
#   Password: ubuntu
# =============================================================================

name: ubuntu-cis-targets

services:

  # ===========================================================================
  # Ubuntu 20.04 — Optimized
  # ===========================================================================

  ubuntu20-optim:
    build:
      context: ./ubuntu_20_optim
      dockerfile: Dockerfile

    container_name: ubuntu20-optim-vm
    hostname: ubuntu20-optim

    ports:
      - "2220:22"

    volumes:
      - ubuntu20-optim-data:/home/dev

    networks:
      vm-net:
        ipv4_address: 172.20.0.20

    restart: unless-stopped

    cap_add:
      - SYS_ADMIN

    healthcheck:
      test: ["CMD", "pgrep", "sshd"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s


  # ===========================================================================
  # Ubuntu 20.04 — Mixed
  # ===========================================================================

  ubuntu20-mix:
