# =============================================================================
# Shared Network
# =============================================================================

networks:

  vm-net:
    driver: bridge

    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1


# =============================================================================
# Persistent Volumes
# =============================================================================

volumes:

  ubuntu20-optim-data:
    name: ubuntu20-optim-home-data

  ubuntu20-mix-data:
    name: ubuntu20-mix-home-data

  ubuntu22-optim-data:
    name: ubuntu22-optim-home-data

  ubuntu22-mix-data:
    name: ubuntu22-mix-home-data

  ubuntu24-optim-data:
    name: ubuntu24-optim-home-data

  ubuntu24-mix-data:
    name: ubuntu24-mix-home-data

  ubuntu20-base-data:
    name: ubuntu20-base-home-data

  ubuntu22-base-data:
    name: ubuntu22-base-home-data

  ubuntu24-base-data:
    name: ubuntu24-base-home-data